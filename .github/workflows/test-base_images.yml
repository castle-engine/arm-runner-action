name: Test base images
on:
  push:
    branches:
      - 'main'
      - 'releases/**'
  pull_request:
  workflow_dispatch:

jobs:
  build_base_images:
    strategy:
      fail-fast: false
      matrix:
        image:
          - raspios_lite:latest
          - raspios_lite_arm64:latest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./ # pguyot/arm-runner-action@HEAD
      with:
        base_image: ${{ matrix.image }}
        cpu: cortex-a7
        commands: |
          cat /etc/os-release
          uname -a
